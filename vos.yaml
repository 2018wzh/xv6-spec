version: vos.project.v1
build:
  program: make
  args: []
  cwd: .
  env: []
  timeout: 120000
  artifacts: [kernel/kernel]
runners:
  qemu:
    program: make
    args: [qemu]
    cwd: .
    env: []
    timeout: 120000
    artifacts: []
  hardware:
    program: sh
    args: [-c, 'exit 2']
    cwd: .
    env: []
    timeout: 1000
    artifacts: []
checks:
  bootstrap_banner_not_null:
    program: sh
    args: [tests/public/verify.sh, bootstrap_banner_not_null]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/boot]
  kalloc_alignment:
    program: sh
    args: [tests/public/verify.sh, kalloc_alignment]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/memory]
  kvmmake_identity_mapping:
    program: sh
    args: [tests/public/verify.sh, kvmmake_identity_mapping]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/memory]
  trap_init_stvec_set:
    program: sh
    args: [tests/public/verify.sh, trap_init_stvec_set]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/trap]
  devintr_timer:
    program: sh
    args: [tests/public/verify.sh, devintr_timer]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/trap]
  uart_boot_output:
    program: sh
    args: [tests/public/verify.sh, uart_boot_output]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/trap]
  fork_returns_different_pid:
    program: sh
    args: [tests/public/verify.sh, fork_returns_different_pid]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/process]
  syscall_valid_number:
    program: sh
    args: [tests/public/verify.sh, syscall_valid_number]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/process]
  bread_cache_hit:
    program: sh
    args: [tests/public/verify.sh, bread_cache_hit]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/fs]
  log_recovery_committed:
    program: sh
    args: [tests/public/verify.sh, log_recovery_committed]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/fs]
  exec_valid_elf:
    program: sh
    args: [tests/public/verify.sh, exec_valid_elf]
    cwd: .
    env: []
    timeout: 120000
    verifies: [kernel/fs]
