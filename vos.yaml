version: vos.project.v1
build:
  program: make
  args:
  - all
  cwd: .
  env:
  - PATH
  - TOOLPREFIX
  timeout: 180000
  artifacts:
  - build/kernel.elf
  - build/kernel.bin
  - build/kernel.asm
  - fs.img
runners:
  qemu:
    program: bash
    args:
    - tests/public/verify.sh
    - shell_boots
    cwd: .
    env:
    - PATH
    - TOOLPREFIX
    timeout: 60000
    artifacts:
    - build/qemu_boot.log
    - build/public/shell_boots.log
    workload: boot-smoke
  hardware:
    program: python3
    args:
    - tools/vf2_hardware_runner.py
    cwd: .
    env:
    - PATH
    - VOS_VF2_BOARD_ALIAS
    - VOS_VF2_SERIAL_PORT
    timeout: 1500000
    artifacts:
    - .vos/hardware/visionfive2-evidence.json
    - .vos/hardware/visionfive2-serial.log
    board: visionfive2-v1.3b
    serial: VOS_VF2_SERIAL_PORT
    workload: four-hart-usertests
