version: vos.project.v1
build:
  program: make
  args: []
  cwd: .
  env:
    - PATH
  timeout: 120000
  artifacts:
    - kernel/kernel
runners:
  qemu:
    program: make
    args:
      - qemu
    cwd: .
    env:
      - PATH
    timeout: 120000
    artifacts: []
  hardware:
    program: sh
    args:
      - -c
      - exit 2
    cwd: .
    env:
      - PATH
    timeout: 1000
    artifacts: []
checks:
  ctf-warmup-linux-public:
    args:
      - tests/generated/lab/ctf-warmup/run-tests.sh
      - linux
      - "7"
    artifacts:
      - lab1/build/verify-linux.log
    cwd: .
    env:
      - PATH
    kind: public
    program: bash
    timeout: 60000
    verifies:
      - lab/ctf-warmup
  ctf-warmup-baremetal-public:
    args:
      - tests/generated/lab/ctf-warmup/run-tests.sh
      - baremetal
      - "7"
    artifacts:
      - lab1/build/verify-baremetal.log
      - lab1/build/ctf-baremetal.elf
    cwd: .
    env:
      - PATH
    kind: public
    program: bash
    timeout: 90000
    verifies:
      - lab/ctf-warmup
  ctf-warmup-contract:
    args:
      - tests/generated/lab/ctf-warmup/run-tests.sh
      - contract
      - "11"
    artifacts:
      - lab1/build/verify-linux.log
      - lab1/build/verify-baremetal.log
    cwd: .
    env:
      - PATH
    kind: contract
    program: bash
    timeout: 90000
    verifies:
      - lab/ctf-warmup
  ctf-warmup-fuzz:
    args:
      - tests/generated/lab/ctf-warmup/run-tests.sh
      - fuzz
      - "7"
      - "11"
      - "13"
      - "20240811"
    artifacts:
      - lab1/build/verify-linux.log
      - lab1/build/verify-baremetal.log
    cases: 4
    cwd: .
    env:
      - PATH
    kind: fuzz
    program: bash
    reproduction_artifact: lab1/build/fuzz-repro
    seed: 7
    timeout: 300000
    verifies:
      - lab/ctf-warmup
  ctf-warmup-trace-oracle:
    args:
      - tests/generated/lab/ctf-warmup/run-tests.sh
      - trace
      - "5"
      - "9"
    artifacts:
      - lab1/build/verify-linux.log
      - lab1/build/verify-baremetal.log
    cwd: .
    env:
      - PATH
    kind: trace
    oracle: The public ctf-fixture verify oracle checks that every alternating record from metadata.json appears in the indicated order in each reader log, and a diff confirms both readers emit identical record lines.
    program: bash
    timeout: 180000
    verifies:
      - lab/ctf-warmup
    workload: Run both readers over fixed seeds 5 and 9 against the same generated non-secret fixture and record their redacted metadata plus alternating provenance records in order.
  bootstrap_banner_not_null:
    program: sh
    args:
      - tests/public/verify.sh
      - bootstrap_banner_not_null
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
  bootstrap_qemu_single_banner:
    program: sh
    args:
      - tests/public/verify.sh
      - bootstrap_qemu_single_banner
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
  toolchain_capability_probe:
    program: sh
    args:
      - tests/public/verify.sh
      - toolchain_capability_probe
    cwd: .
    env:
      - PATH
    timeout: 30000
    verifies:
      - toolchain
  toolchain_clean_rebuild:
    program: sh
    args:
      - tests/public/verify.sh
      - toolchain_clean_rebuild
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - toolchain
  kernel_boot_banner_public:
    kind: public
    program: sh
    args:
      - tests/generated/kernel/boot/public_banner.sh
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
    artifacts:
      - kernel/kernel
  kernel_boot_uart_abi_contract:
    kind: contract
    program: sh
    args:
      - tests/generated/kernel/boot/contract_uart_abi.sh
    cwd: .
    env:
      - PATH
    timeout: 30000
    verifies:
      - kernel/boot
    artifacts: []
  kernel_boot_banner_fuzz:
    kind: fuzz
    program: sh
    args:
      - tests/generated/kernel/boot/fuzz_banner.sh
      - "42"
      - "500"
      - tests/generated/kernel/boot/repro/kernel_boot_banner_fuzz.repro
    cwd: .
    env:
      - PATH
    timeout: 30000
    verifies:
      - kernel/boot
    artifacts: []
    seed: 42
    cases: 500
    reproduction_artifact: tests/generated/kernel/boot/repro/kernel_boot_banner_fuzz.repro
  kernel_boot_banner_trace:
    kind: trace
    program: sh
    args:
      - tests/generated/kernel/boot/trace_banner.sh
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
    artifacts:
      - kernel/kernel
    workload: bounded QEMU virt serial capture of the booted Lab 2 kernel via vos_lab2_capture_serial
    oracle: captured serial must contain exactly one XV6_BOOT_OK banner
