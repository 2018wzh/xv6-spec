version: vos.project.v1
build:
  program: make
  args: []
  cwd: .
  env:
    - PATH
  timeout: 120000
  artifacts:
    - kernel/kernel
runners:
  qemu:
    program: make
    args:
      - qemu
    cwd: .
    env:
      - PATH
    timeout: 120000
    artifacts: []
    success_pattern: XV6_BOOT_OK
    failure_pattern: "panic(?:[: ]|$)"
  hardware:
    program: sh
    args:
      - -c
      - exit 2
    cwd: .
    env:
      - PATH
    timeout: 1000
    artifacts: []
checks:
  toolchain_lab10_candidate_contract:
    artifacts: [tests/verification/coverage.md, tests/verification/failure-analysis.md]
    args: [tests/verification/candidate_contract.sh]
    cwd: .
    env: [PATH]
    kind: contract
    program: sh
    timeout: 30000
    verifies: [toolchain]
  platform_visionfive2_candidate_contract:
    artifacts: [spec/design.yaml, spec/modules/platform-visionfive2.yaml]
    args: [tests/generated/platform/visionfive2/candidate_contract.sh]
    cwd: .
    env: [PATH]
    kind: contract
    program: sh
    timeout: 30000
    verifies: [platform/visionfive2, interface/visionfive2-board]
  ctf-warmup-linux-public:
    args:
      - tests/generated/lab/ctf-warmup/run-tests.sh
      - linux
      - "7"
    artifacts:
      - lab1/build/verify-linux.log
    cwd: .
    env:
      - PATH
    kind: public
    program: bash
    timeout: 60000
    verifies:
      - lab/ctf-warmup
  ctf-warmup-baremetal-public:
    args:
      - tests/generated/lab/ctf-warmup/run-tests.sh
      - baremetal
      - "7"
    artifacts:
      - lab1/build/verify-baremetal.log
      - lab1/build/ctf-baremetal.elf
    cwd: .
    env:
      - PATH
    kind: public
    program: bash
    timeout: 90000
    verifies:
      - lab/ctf-warmup
  ctf-warmup-contract:
    args:
      - tests/generated/lab/ctf-warmup/run-tests.sh
      - contract
      - "11"
    artifacts:
      - lab1/build/verify-linux.log
      - lab1/build/verify-baremetal.log
    cwd: .
    env:
      - PATH
    kind: contract
    program: bash
    timeout: 90000
    verifies:
      - lab/ctf-warmup
  ctf-warmup-fuzz:
    args:
      - tests/generated/lab/ctf-warmup/run-tests.sh
      - fuzz
      - "7"
      - "11"
      - "13"
      - "20240811"
    artifacts:
      - lab1/build/verify-linux.log
      - lab1/build/verify-baremetal.log
    cases: 4
    cwd: .
    env:
      - PATH
    kind: fuzz
    program: bash
    reproduction_artifact: lab1/build/fuzz-repro
    seed: 7
    timeout: 300000
    verifies:
      - lab/ctf-warmup
  ctf-warmup-trace-oracle:
    args:
      - tests/generated/lab/ctf-warmup/run-tests.sh
      - trace
      - "5"
      - "9"
    artifacts:
      - lab1/build/verify-linux.log
      - lab1/build/verify-baremetal.log
    cwd: .
    env:
      - PATH
    kind: trace
    oracle: The public ctf-fixture verify oracle checks that every alternating record from metadata.json appears in the indicated order in each reader log, and a diff confirms both readers emit identical record lines.
    program: bash
    timeout: 180000
    verifies:
      - lab/ctf-warmup
    workload: Run both readers over fixed seeds 5 and 9 against the same generated non-secret fixture and record their redacted metadata plus alternating provenance records in order.
  bootstrap_banner_not_null:
    program: sh
    args:
      - tests/public/verify.sh
      - bootstrap_banner_not_null
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
