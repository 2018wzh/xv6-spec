version: vos.project.v1
build:
  program: make
  args: []
  cwd: .
  env:
    - PATH
  timeout: 120000
  artifacts:
    - kernel/kernel
runners:
  qemu:
    program: make
    args:
      - qemu
    cwd: .
    env:
      - PATH
    timeout: 120000
    artifacts: []
  hardware:
    program: sh
    args:
      - -c
      - exit 2
    cwd: .
    env:
      - PATH
    timeout: 1000
    artifacts: []
checks:
  bootstrap_banner_not_null:
    program: sh
    args:
      - tests/public/verify.sh
      - bootstrap_banner_not_null
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
  bootstrap_qemu_single_banner:
    program: sh
    args:
      - tests/public/verify.sh
      - bootstrap_qemu_single_banner
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
  toolchain_capability_probe:
    program: sh
    args:
      - tests/public/verify.sh
      - toolchain_capability_probe
    cwd: .
    env:
      - PATH
    timeout: 30000
    verifies:
      - toolchain
  toolchain_clean_rebuild:
    program: sh
    args:
      - tests/public/verify.sh
      - toolchain_clean_rebuild
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - toolchain
  kernel_boot_banner_public:
    kind: public
    program: sh
    args:
      - tests/generated/kernel/boot/public_banner.sh
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
    artifacts:
      - kernel/kernel
  kernel_boot_uart_abi_contract:
    kind: contract
    program: sh
    args:
      - tests/generated/kernel/boot/contract_uart_abi.sh
    cwd: .
    env:
      - PATH
    timeout: 30000
    verifies:
      - kernel/boot
    artifacts: []
  kernel_boot_banner_fuzz:
    kind: fuzz
    program: sh
    args:
      - tests/generated/kernel/boot/fuzz_banner.sh
      - "42"
      - "500"
      - tests/generated/kernel/boot/repro/kernel_boot_banner_fuzz.repro
    cwd: .
    env:
      - PATH
    timeout: 30000
    verifies:
      - kernel/boot
    artifacts: []
    seed: 42
    cases: 500
    reproduction_artifact: tests/generated/kernel/boot/repro/kernel_boot_banner_fuzz.repro
  kernel_boot_banner_trace:
    kind: trace
    program: sh
    args:
      - tests/generated/kernel/boot/trace_banner.sh
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
    artifacts:
      - kernel/kernel
    workload: bounded QEMU virt serial capture of the booted Lab 2 kernel via vos_lab2_capture_serial
    oracle: captured serial must contain exactly one XV6_BOOT_OK banner
  kernel_boot_bootstrap_behavior_public:
    kind: public
    program: sh
    args:
      - tests/generated/kernel/boot/behavior_boot.sh
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
    artifacts:
      - kernel/kernel
  kernel_boot_bootstrap_pmp_contract:
    kind: contract
    program: sh
    args:
      - tests/generated/kernel/boot/contract_pmp_before_mret.sh
    cwd: .
    env:
      - PATH
    timeout: 30000
    verifies:
      - kernel/boot
    artifacts: []
  kernel_boot_banner_immutability_fuzz:
    kind: fuzz
    program: sh
    args:
      - tests/generated/kernel/boot/fuzz_immutable_banner.sh
      - "42"
      - "400"
      - tests/generated/kernel/boot/repro/kernel_boot_banner_immutability_fuzz.repro
    cwd: .
    env:
      - PATH
    timeout: 60000
    verifies:
      - kernel/boot
    artifacts: []
    seed: 42
    cases: 400
    reproduction_artifact: tests/generated/kernel/boot/repro/kernel_boot_banner_immutability_fuzz.repro
  kernel_boot_bootstrap_entry_trace:
    kind: trace
    program: sh
    args:
      - tests/generated/kernel/boot/trace_entry_boot.sh
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/boot
    artifacts:
      - kernel/kernel
    workload: bounded QEMU virt serial capture of the booted Lab 2 kernel via vos_lab2_capture_serial
    oracle: captured serial must contain exactly one canonical XV6_BOOT_OK banner line and no partial/garbage banner line
  kernel_memory_allocator_boot_public:
    artifacts:
      - kernel/kernel
    args:
      - tests/generated/kernel/memory/public_allocator_boot.sh
    cwd: .
    env:
      - PATH
    kind: public
    program: sh
    timeout: 120000
    verifies:
      - kernel/memory
  kernel_memory_allocator_contract:
    artifacts: []
    args:
      - tests/generated/kernel/memory/contract_memory.sh
    cwd: .
    env:
      - PATH
    kind: contract
    program: sh
    timeout: 30000
    verifies:
      - kernel/memory
  kernel_memory_allocator_fuzz:
    artifacts: []
    args:
      - tests/generated/kernel/memory/fuzz_allocator.sh
      - "42"
      - "500"
      - tests/generated/kernel/memory/repro/kernel_memory_allocator_fuzz.repro
    cases: 500
    cwd: .
    env:
      - PATH
    kind: fuzz
    program: sh
    reproduction_artifact: tests/generated/kernel/memory/repro/kernel_memory_allocator_fuzz.repro
    seed: 42
    timeout: 30000
    verifies:
      - kernel/memory
  kernel_memory_mapping_trace:
    artifacts:
      - kernel/kernel
    args:
      - tests/generated/kernel/memory/trace_mapping.sh
    cwd: .
    env:
      - PATH
    kind: trace
    oracle: captured serial must contain exactly one canonical XV6_BOOT_OK banner line
    program: sh
    timeout: 120000
    verifies:
      - kernel/memory
    workload: bounded QEMU virt serial capture of the booted Lab 3 kernel via vos_lab2_capture_serial
  kernel_trap_boot_public:
    kind: public
    program: sh
    args:
      - tests/generated/kernel/trap/public_trap_boot.sh
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/trap
    artifacts:
      - kernel/kernel
  kernel_trap_vector_contract:
    kind: contract
    program: sh
    args:
      - tests/generated/kernel/trap/contract_vector.sh
    cwd: .
    env:
      - PATH
    timeout: 30000
    verifies:
      - kernel/trap
    artifacts: []
  kernel_trap_device_contract:
    kind: contract
    program: sh
    args:
      - tests/generated/kernel/trap/contract_device.sh
    cwd: .
    env:
      - PATH
    timeout: 30000
    verifies:
      - kernel/trap
    artifacts: []
  kernel_trap_frame_fuzz:
    kind: fuzz
    program: sh
    args:
      - tests/generated/kernel/trap/fuzz_frame.sh
      - "42"
      - "500"
      - tests/generated/kernel/trap/repro/kernel_trap_frame_fuzz.repro
    cwd: .
    env:
      - PATH
    timeout: 30000
    verifies:
      - kernel/trap
    artifacts: []
    seed: 42
    cases: 500
    reproduction_artifact: tests/generated/kernel/trap/repro/kernel_trap_frame_fuzz.repro
  kernel_trap_roundtrip_trace:
    kind: trace
    program: sh
    args:
      - tests/generated/kernel/trap/trace_roundtrip.sh
    cwd: .
    env:
      - PATH
    timeout: 120000
    verifies:
      - kernel/trap
    artifacts:
      - kernel/kernel
    workload: bounded QEMU virt serial capture of the booted Lab 4 kernel via vos_lab2_capture_serial
    oracle: captured serial must contain exactly one canonical XV6_BOOT_OK banner line and kernel/main.c must wire trapinit before intr_on() so the vector is installed before supervisor interrupts are enabled
  kernel_process_boot_public:
    args:
      - tests/generated/kernel/process/public_process_boot.sh
    artifacts:
      - kernel/kernel
    cwd: .
    env:
      - PATH
    kind: public
    program: sh
    timeout: 60000
    verifies:
      - kernel/process
  kernel_process_lifecycle_contract:
    args:
      - tests/generated/kernel/process/contract_lifecycle.sh
    artifacts: []
    cwd: .
    env:
      - PATH
    kind: contract
    program: sh
    timeout: 60000
    verifies:
      - kernel/process
  kernel_process_context_contract:
    args:
      - tests/generated/kernel/process/contract_context.sh
    artifacts: []
    cwd: .
    env:
      - PATH
    kind: contract
    program: sh
    timeout: 60000
    verifies:
      - kernel/process
  kernel_process_wakeup_contract:
    args:
      - tests/generated/kernel/process/wakeup_contract.sh
    artifacts: []
    cwd: .
    env:
      - PATH
    kind: contract
    program: sh
    timeout: 60000
    verifies:
      - kernel/process
  kernel_process_state_fuzz:
    args:
      - tests/generated/kernel/process/fuzz_state.sh
      - "42"
      - "500"
      - tests/generated/kernel/process/repro/kernel_process_state_fuzz.repro
    artifacts: []
    cases: 500
    cwd: .
    env:
      - PATH
    kind: fuzz
    program: sh
    reproduction_artifact: tests/generated/kernel/process/repro/kernel_process_state_fuzz.repro
    seed: 42
    timeout: 60000
    verifies:
      - kernel/process
  kernel_process_scheduler_trace:
    args:
      - tests/generated/kernel/process/trace_scheduler.sh
    artifacts:
      - kernel/kernel
    cwd: .
    env:
      - PATH
    kind: trace
    oracle: exactly one canonical XV6_BOOT_OK banner line and no partial/garbage banner; procinit precedes intr_on in boot order
    program: sh
    timeout: 60000
    verifies:
      - kernel/process
    workload: bounded QEMU virt serial capture of the booted Lab 5 kernel via vos_lab2_capture_serial (procinit + scheduler activated on the single boot hart)
