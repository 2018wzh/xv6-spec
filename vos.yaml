version: vos.project.v1
build:
  program: make
  args: []
  cwd: .
  env: [PATH]
  timeout: 120000
  artifacts: [kernel/kernel]
runners:
  qemu:
    program: make
    args: [qemu]
    cwd: .
    env: [PATH]
    timeout: 120000
    artifacts: []
  hardware:
    program: sh
    args: [-c, 'exit 2']
    cwd: .
    env: [PATH]
    timeout: 1000
    artifacts: []
checks:
  bootstrap_banner_not_null:
    program: sh
    args: [tests/public/verify.sh, bootstrap_banner_not_null]
    cwd: .
    env: [PATH]
    timeout: 120000
    verifies: [kernel/boot]
  bootstrap_qemu_single_banner:
    program: sh
    args: [tests/public/verify.sh, bootstrap_qemu_single_banner]
    cwd: .
    env: [PATH]
    timeout: 120000
    verifies: [kernel/boot]
  toolchain_capability_probe:
    program: sh
    args: [tests/public/verify.sh, toolchain_capability_probe]
    cwd: .
    env: [PATH]
    timeout: 30000
    verifies: [toolchain]
  toolchain_clean_rebuild:
    program: sh
    args: [tests/public/verify.sh, toolchain_clean_rebuild]
    cwd: .
    env: [PATH]
    timeout: 120000
    verifies: [toolchain]
