id: lab5-process-syscall
reason: Lab 5 composes process lifecycle, per-process memory, user trap return, and syscall dispatch across the existing boot, memory, and trap stages.
changes:
- kernel/process
- kernel/syscall
- kernel/trap
- kernel/memory
- kernel/boot
- toolchain
new_invariants:
- A process owns exactly one trap frame and user page table from allocproc until freeproc.
- User registers cross privilege only through the interface/trap-frame layout and syscall arguments cross only through validated copy helpers.
