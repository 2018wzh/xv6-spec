id: interface/kernel-printk
name: kernel/printk driver boundary
boundary: driver
module: kernel/printk
operations:
- name: panic
  pre: []
  post:
  - kernel is halted
  errors:
  - never returns; spins forever
  properties:
  - id: panic-property-1
    text: 'guarantee.returns: void (never returns)'
  - id: panic-property-2
    text: 'guarantee.side_effects: panic message printed'
  - id: panic-property-3
    text: 'guarantee.side_effects: kernel halted forever'
- name: printk
  pre:
  - printkinit has been called
  post:
  - formatted string is on the console
  errors:
  - none
  properties:
  - id: printk-property-1
    text: 'guarantee.returns.int: 0'
  - id: printk-property-2
    text: 'guarantee.side_effects: formatted output written to console'
- name: printkinit
  pre:
  - called once during boot
  post:
  - printk is ready
  errors:
  - none
  properties:
  - id: printkinit-property-1
    text: 'guarantee.returns: void'
  - id: printkinit-property-2
    text: 'guarantee.side_effects: pr.lock initialized'
