id: interface/trap-frame
name: user trap-frame ABI
boundary: abi
module: kernel/trap
operations:
- name: uservec_userret
  pre:
  - the process owns a mapped TRAPFRAME page
  post:
  - all user registers cross privilege boundaries only through that page
  errors:
  - unexpected privilege state panics in the kernel trap path
  properties:
  - id: trap-frame-register-ownership
    text: trap-frame registers belong to exactly one process while it is runnable
