id: interface/resource
name: kernel resource ownership ABI
boundary: abi
module: kernel/file
operations:
- name: resource_acquire_release
  pre:
  - the caller holds or obtains a valid reference
  post:
  - the last release reclaims the owned kernel resource
  errors:
  - invalid or exhausted resource allocation fails explicitly
  properties:
  - id: resource-single-reclamation
    text: pages, inodes, file descriptions and pipe endpoints are reclaimed exactly once
