  text: kalloc_kfree_cycle
- id: module-property-14
  text: kfree_double_free_detection
- id: module-property-15
  text: kvmmake_identity_mapping
- id: module-property-16
  text: kvmmake_trampoline_mapped
- id: module-property-17
  text: kvmmake_page_table_depth
- id: module-property-18
  text: walk_valid_mapping
- id: module-property-19
  text: walk_invalid_virtual_address
- id: module-property-20
  text: walkaddr_u_bit_check
- id: module-property-21
  text: uvmcopy_isolation
- id: module-property-22
