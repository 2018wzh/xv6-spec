- 'copyin.guarantee.emitted_events: none'
- 'copyin.guarantee.returns: -1 on invalid user address'
- 'copyin.guarantee.returns: 0 on success'
- 'copyin.guarantee.side_effects: dst populated with len bytes from user memory'
- 'copyinstr.guarantee.emitted_events: none'
- 'copyinstr.guarantee.returns: -1 on invalid user address or if max bytes exceeded'
- 'copyinstr.guarantee.returns: string length (including null terminator) on success'
- 'copyinstr.guarantee.side_effects: dst populated with null-terminated string from
  user memory'
- 'copyout.guarantee.emitted_events: none'
- 'copyout.guarantee.returns: -1 on invalid user address'
- 'copyout.guarantee.returns: 0 on success'
- 'copyout.guarantee.side_effects: user memory at dstva written with len bytes'
- every allocated page is 4096-byte aligned and zeroed
