id: kernel/memory
module: kernel/memory
level: 3
purpose: Physical page allocator with freelist, Sv39 page table construction, kernel
  virtual address mapping, and user page table management.
owns:
- kernel/kalloc.c
- kernel/vm.c
- tests/generated/kernel/memory
interface:
- name: copyin
  pre:
  - dst points to valid kernel buffer of at least len bytes
  - srcva is a user virtual address in current process
  post:
  - dst contains len bytes from srcva (on success)
  errors:
  - returns -1 if walkaddr returns 0 for any page in range
  properties:
  - id: copyin-property-1
    text: kernel is never corrupted by invalid user addresses
  - id: copyin-property-2
    text: 'guarantee.returns: 0 on success'
  - id: copyin-property-3
    text: 'guarantee.returns: -1 on invalid user address'
  - id: copyin-property-4
    text: 'guarantee.side_effects: dst populated with len bytes from user memory'
  - id: copyin-property-5
    text: 'guarantee.emitted_events: none'
- name: copyinstr
  pre:
  - srcva is a user virtual address in current process
  - dst points to valid kernel buffer
  - max bytes specifies maximum copy length
  post:
  - dst contains null-terminated string (on success)
  - no more than max bytes copied
  errors:
  - returns -1 if any page in the string range is invalid
  - returns -1 if no null terminator found within max bytes
  properties:
  - id: copyinstr-property-1
    text: kernel never overruns kernel buffer
  - id: copyinstr-property-2
    text: kernel never dereferences raw user pointers
  - id: copyinstr-property-3
    text: 'guarantee.returns: string length (including null terminator) on success'
  - id: copyinstr-property-4
    text: 'guarantee.returns: -1 on invalid user address or if max bytes exceeded'
  - id: copyinstr-property-5
    text: 'guarantee.side_effects: dst populated with null-terminated string from
      user memory'
  - id: copyinstr-property-6
    text: 'guarantee.emitted_events: none'
- name: copyout
  pre:
  - src points to valid kernel buffer of at least len bytes
  - dstva is a user virtual address
  post:
  - dstva contains len bytes from src (on success)
  errors:
  - returns -1 if walkaddr returns 0 for any page in range
  properties:
  - id: copyout-property-1
    text: kernel memory is never disclosed via invalid copyout
  - id: copyout-property-2
    text: 'guarantee.returns: 0 on success'
  - id: copyout-property-3
    text: 'guarantee.returns: -1 on invalid user address'
  - id: copyout-property-4
    text: 'guarantee.side_effects: user memory at dstva written with len bytes'
  - id: copyout-property-5
    text: 'guarantee.emitted_events: none'
- name: kalloc
  pre:
  - kernel is initialized past kinit
  post:
  - returned page is 4096-byte aligned and zeroed
  errors:
  - returns NULL when freelist is empty
  properties:
  - id: kalloc-property-1
    text: freelist integrity (no double-links)
  - id: kalloc-property-2
    text: 'guarantee.returns: void * to a 4096-byte zeroed page on success'
  - id: kalloc-property-3
    text: 'guarantee.returns: NULL on exhaustion'
  - id: kalloc-property-4
    text: 'guarantee.side_effects: page is removed from freelist'
  - id: kalloc-property-5
    text: 'guarantee.side_effects: page content is zeroed'
  - id: kalloc-property-6
    text: 'guarantee.emitted_events: none'
- name: kfree
  pre:
  - pointer is 4096-byte aligned
  - pointer points to a valid physical page in range
  post:
  - page is on freelist
  errors:
  - caller is responsible for valid pointer
  - double-free may corrupt freelist (undefined)
  properties:
  - id: kfree-property-1
    text: freelist integrity
  - id: kfree-property-2
    text: no page appears twice on freelist
  - id: kfree-property-3
    text: 'guarantee.returns: void'
  - id: kfree-property-4
    text: 'guarantee.side_effects: page is re-linked to freelist head'
  - id: kfree-property-5
    text: 'guarantee.side_effects: page content is zeroed'
  - id: kfree-property-6
    text: 'guarantee.emitted_events: none'
- name: kinit
  pre:
  - called exactly once during early kernel init
  - page allocator is not yet in use
  post:
  - freelist is non-empty (at least one page)
  - kmem.lock is initialized
  errors:
  - panics if end >= PHYSTOP (no free memory)
  properties:
  - id: kinit-property-1
    text: freelist pages are 4096-byte aligned
  - id: kinit-property-2
    text: 'guarantee.returns: void'
  - id: kinit-property-3
    text: 'guarantee.side_effects: freelist is populated with all free physical pages'
  - id: kinit-property-4
    text: 'guarantee.side_effects: each page is zeroed via memset'
  - id: kinit-property-5
    text: 'guarantee.emitted_events: none'
- name: kvmmake
  pre:
  - called once during kernel init, after kinit
  post:
  - kernel_pagetable maps all kernel text/data/device regions
  errors:
  - panics if kalloc fails during page table construction
  properties:
  - id: kvmmake-property-1
    text: PTEs have U-bit == 0
  - id: kvmmake-property-2
    text: 'guarantee.returns: pagetable_t (pointer to L2 page directory)'
  - id: kvmmake-property-3
    text: 'guarantee.side_effects: kernel_pagetable is populated'
  - id: kvmmake-property-4
    text: 'guarantee.side_effects: trampoline code mapped at (TRAMPOLINE, MAXVA-PGSIZE]'
  - id: kvmmake-property-5
    text: 'guarantee.side_effects: UART, PLIC, VIRTIO mapped (optional)'
  - id: kvmmake-property-6
    text: 'guarantee.emitted_events: none'
- name: kvmmap
  pre:
  - va and pa are page-aligned
  - size is a multiple of PGSIZE
  post:
  - va..va+size maps to pa..pa+size with given perm
  errors:
  - panics if kalloc fails for intermediate PT page
  properties:
  - id: kvmmap-property-1
    text: no PTE is overwritten without explicit intent
  - id: kvmmap-property-2
    text: 'guarantee.returns: void'
  - id: kvmmap-property-3
    text: 'guarantee.side_effects: PTE(s) installed in target pagetable'
  - id: kvmmap-property-4
    text: 'guarantee.side_effects: intermediate page table pages allocated if needed'
  - id: kvmmap-property-5
    text: 'guarantee.emitted_events: none'
- name: uvmalloc
  pre:
  - oldsz and newsz are page-aligned
  - newsz > oldsz
  post:
  - address range [oldsz, newsz) is mapped and accessible
  errors:
  - returns oldsz if kalloc fails (no partial mapping)
  - previously mapped pages are unaffected
  properties:
  - id: uvmalloc-property-1
    text: user page table integrity
  - id: uvmalloc-property-2
    text: new pages have PTE_U and PTE_W set
  - id: uvmalloc-property-3
    text: 'guarantee.returns: newsz on success'
  - id: uvmalloc-property-4
    text: 'guarantee.returns: oldsz on failure (no partial growth)'
  - id: uvmalloc-property-5
    text: 'guarantee.side_effects: new pages allocated and mapped from oldsz to newsz'
  - id: uvmalloc-property-6
    text: 'guarantee.side_effects: each new page is zeroed'
  - id: uvmalloc-property-7
    text: 'guarantee.emitted_events: none'
- name: uvmcopy
  pre:
  - old is a valid pagetable
  - size specifies the range [0, size) to copy
  post:
  - child has identical but independent memory
  errors:
  - on kalloc failure, frees partial copy and returns 0
  properties:
  - id: uvmcopy-property-1
    text: no page is shared between parent and child
  - id: uvmcopy-property-2
    text: 'guarantee.returns: pagetable_t on success (complete copy)'
  - id: uvmcopy-property-3
    text: 'guarantee.returns: 0 on failure (partial mappings unmapped)'
  - id: uvmcopy-property-4
    text: 'guarantee.side_effects: all old pages are duplicated'
  - id: uvmcopy-property-5
    text: 'guarantee.side_effects: PTE_W is cleared in both old and new PTEs'
  - id: uvmcopy-property-6
    text: 'guarantee.emitted_events: none'
- name: uvmcreate
  pre:
  - called from kernel context
  post:
  - returned page table has all entries zero
  errors:
  - returns 0 if kalloc fails
  properties:
  - id: uvmcreate-property-1
    text: no kernel mappings in user page table
  - id: uvmcreate-property-2
    text: 'guarantee.returns: pagetable_t (new user page table) on success'
  - id: uvmcreate-property-3
    text: 'guarantee.returns: 0 on kalloc failure'
  - id: uvmcreate-property-4
    text: 'guarantee.side_effects: one page allocated, zeroed'
  - id: uvmcreate-property-5
    text: 'guarantee.emitted_events: none'
- name: uvmdealloc
  pre:
  - oldsz > newsz
  - newsz >= 0
  post:
  - address space size reduced to newsz
  errors:
  - returns oldsz (no-op) if newsz >= oldsz
  properties:
  - id: uvmdealloc-property-1
    text: no dangling page mappings
  - id: uvmdealloc-property-2
    text: 'guarantee.returns: newsz on success'
  - id: uvmdealloc-property-3
    text: 'guarantee.returns: oldsz if newsz >= oldsz (no-op)'
  - id: uvmdealloc-property-4
    text: 'guarantee.side_effects: pages in [newsz, oldsz) unmapped and freed'
  - id: uvmdealloc-property-5
    text: 'guarantee.side_effects: process->sz updated to newsz'
  - id: uvmdealloc-property-6
    text: 'guarantee.emitted_events: none'
- name: uvmfree
  pre:
  - pagetable is a valid root page directory
  - process is exiting or fork has failed
  post:
  - all memory associated with pagetable is released
  errors:
  - none (always succeeds)
  properties:
  - id: uvmfree-property-1
    text: no memory leak
  - id: uvmfree-property-2
    text: 'guarantee.returns: void'
  - id: uvmfree-property-3
    text: 'guarantee.side_effects: all leaf pages freed via kfree'
  - id: uvmfree-property-4
    text: 'guarantee.side_effects: all page-table pages freed via kfree'
  - id: uvmfree-property-5
    text: 'guarantee.side_effects: pagetable root page freed'
  - id: uvmfree-property-6
    text: 'guarantee.emitted_events: none'
- name: uvminit
  pre:
  - pagetable is a newly created empty page table
  post:
  - user page table has trampoline and trapframe mappings
  errors:
  - panics if kalloc fails for trapframe
  properties:
  - id: uvminit-property-1
    text: TRAMPOLINE mapping is identical in all user page tables
  - id: uvminit-property-2
    text: 'guarantee.returns: void'
  - id: uvminit-property-3
    text: 'guarantee.side_effects: trampoline page mapped at TRAMPOLINE (read+execute)'
  - id: uvminit-property-4
    text: 'guarantee.side_effects: trapframe page allocated and mapped at TRAPFRAME
      (read+write)'
  - id: uvminit-property-5
    text: 'guarantee.emitted_events: none'
- name: uvmunmap
  pre:
  - va is page-aligned
  - npages > 0
  post:
  - '[va, va+npages*PGSIZE) has no valid mappings'
  errors:
  - panics if a PTE is missing (inconsistent state)
  properties:
  - id: uvmunmap-property-1
    text: page table consistency
  - id: uvmunmap-property-2
    text: 'guarantee.returns: void'
  - id: uvmunmap-property-3
    text: 'guarantee.side_effects: npages unmapped from pagetable'
  - id: uvmunmap-property-4
    text: 'guarantee.side_effects: physical pages freed if do_free'
  - id: uvmunmap-property-5
    text: 'guarantee.emitted_events: none'
- name: walk
  pre:
  - pagetable is page-aligned
  - va is a canonical Sv39 address (bits 63:39 sign-extended)
  post:
  - returned PTE is valid and writable
  errors:
  - returns NULL on missing levels (alloc==0)
  - panics if va is not canonical
  properties:
  - id: walk-property-1
    text: Sv39 structure integrity
  - id: walk-property-2
    text: 'guarantee.returns: pte_t * to the L0 PTE on success'
  - id: walk-property-3
    text: 'guarantee.returns: NULL if alloc==0 and a level is missing'
  - id: walk-property-4
    text: 'guarantee.returns: NULL if alloc!=0 and kalloc fails'
  - id: walk-property-5
    text: 'guarantee.side_effects: intermediate PT pages allocated when alloc != 0'
  - id: walk-property-6
    text: 'guarantee.emitted_events: none'
- name: walkaddr
  pre:
  - va is a valid virtual address
  post:
  - returned PA is page-aligned (lower 12 bits from va)
  errors:
  - returns 0 for invalid va or kernel-only mappings
  properties:
  - id: walkaddr-property-1
    text: no page table mutation
  - id: walkaddr-property-2
    text: 'guarantee.returns: uint64 physical address on valid user mapping'
  - id: walkaddr-property-3
    text: 'guarantee.returns: 0 on missing/invalid PTE or non-user mapping'
  - id: walkaddr-property-4
    text: 'guarantee.side_effects: none'
  - id: walkaddr-property-5
    text: 'guarantee.emitted_events: none'
properties:
- id: module-property-1
  text: kernel page table entries have U-bit clear
- id: module-property-2
  text: copyin/copyout validate user addresses via walkaddr
- id: module-property-3
  text: user page tables never map kernel pages
- id: module-property-4
  text: allocated pages are freed back to freelist via kfree
- id: module-property-5
  text: page tables are freed recursively (3-level walk)
- id: module-property-6
  text: alloc-free cycle coverage
- id: module-property-7
  text: page table walk correctness
- id: module-property-8
  text: copyin/copyout boundary checks
