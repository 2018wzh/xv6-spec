  text: kalloc_zeroed
- id: module-property-30
  text: kalloc_kfree_cycle
- id: module-property-31
  text: kvmmake_identity_mapping
- id: module-property-32
  text: kvmmake_trampoline_mapped
- id: module-property-33
  text: walkaddr_u_bit_check
- id: module-property-34
  text: copyin_invalid_address
- id: module-property-35
  text: copyout_readonly_page
errors:
- caller is responsible for valid pointer
- double-free may corrupt freelist (undefined)
- kalloc returns NULL when freelist is exhausted
- none (always succeeds)
- on kalloc failure, frees partial copy and returns 0
- panics if a PTE is missing (inconsistent state)
- panics if end >= PHYSTOP (no free memory)
- panics if kalloc fails during page table construction
- panics if kalloc fails for intermediate PT page
- panics if kalloc fails for trapframe
- panics if va is not canonical
- previously mapped pages are unaffected
- returns -1 if any page in the string range is invalid
- returns -1 if no null terminator found within max bytes
- returns -1 if walkaddr returns 0 for any page in range
- returns 0 for invalid va or kernel-only mappings
- returns 0 if kalloc fails
- returns NULL on missing levels (alloc==0)
- returns NULL when freelist is empty
- returns oldsz (no-op) if newsz >= oldsz
- returns oldsz if kalloc fails (no partial mapping)
- uvmunmap panics on missing mappings
- walk returns NULL for invalid virtual addresses
state:
  stage: memory
  owned_state:
  - physical page freelist
  - kernel page table (kernel_pagetable)
  - physical memory layout bounds
  resource_lifetime:
  - allocated pages are freed back to freelist via kfree
  - page tables are freed recursively (3-level walk)
preconditions:
- called exactly once during early kernel init
- called from kernel context
- called once during kernel init, after kinit
- dst points to valid kernel buffer
- dst points to valid kernel buffer of at least len bytes
- dstva is a user virtual address
- kernel is initialized past kinit
- max bytes specifies maximum copy length
- newsz > oldsz
- newsz >= 0
- npages > 0
- old is a valid pagetable
- oldsz > newsz
- oldsz and newsz are page-aligned
- page allocator is not yet in use
- pagetable is a newly created empty page table
- pagetable is a valid root page directory
- pagetable is page-aligned
- pointer is 4096-byte aligned
- pointer points to a valid physical page in range
- process is exiting or fork has failed
- size is a multiple of PGSIZE
- size specifies the range [0, size) to copy
- src points to valid kernel buffer of at least len bytes
- srcva is a user virtual address in current process
- va and pa are page-aligned
- va is a canonical Sv39 address (bits 63:39 sign-extended)
- va is a valid virtual address
- va is page-aligned
postconditions:
- '[va, va+npages*PGSIZE) has no valid mappings'
- address range [oldsz, newsz) is mapped and accessible
- address space size reduced to newsz
- all memory associated with pagetable is released
- child has identical but independent memory
- dst contains len bytes from srcva (on success)
- dst contains null-terminated string (on success)
- dstva contains len bytes from src (on success)
- freelist is non-empty (at least one page)
- kernel_pagetable maps all kernel text/data/device regions
- kmem.lock is initialized
- no more than max bytes copied
- page is on freelist
- returned PA is page-aligned (lower 12 bits from va)
- returned PTE is valid and writable
- returned page is 4096-byte aligned and zeroed
- returned page table has all entries zero
- user page table has trampoline and trapframe mappings
- va..va+size maps to pa..pa+size with given perm
invariants:
- id: invariant-1
  text: every allocated page is 4096-byte aligned
- id: invariant-2
  text: freelist is a singly-linked list of free pages
- id: invariant-3
  text: a page is either on the freelist OR allocated, never both
- id: invariant-4
  text: kernel_pagetable provides identity mapping 0x80000000..0x88000000
- id: invariant-5
  text: Sv39 PTEs use DAG-extension permissions (R/W/X bits)
- id: copyin-invariant-1
  text: kernel is never corrupted by invalid user addresses
- id: copyinstr-invariant-1
  text: kernel never overruns kernel buffer
- id: copyinstr-invariant-2
  text: kernel never dereferences raw user pointers
- id: copyout-invariant-1
  text: kernel memory is never disclosed via invalid copyout
- id: kalloc-invariant-1
  text: freelist integrity (no double-links)
- id: kfree-invariant-1
  text: freelist integrity
- id: kfree-invariant-2
  text: no page appears twice on freelist
- id: kinit-invariant-1
  text: freelist pages are 4096-byte aligned
- id: kvmmake-invariant-1
  text: PTEs have U-bit == 0
- id: kvmmap-invariant-1
  text: no PTE is overwritten without explicit intent
- id: uvmalloc-invariant-1
  text: user page table integrity
- id: uvmalloc-invariant-2
  text: new pages have PTE_U and PTE_W set
- id: uvmcopy-invariant-1
  text: no page is shared between parent and child
- id: uvmcreate-invariant-1
  text: no kernel mappings in user page table
- id: uvmdealloc-invariant-1
  text: no dangling page mappings
- id: uvmfree-invariant-1
  text: no memory leak
- id: uvminit-invariant-1
  text: TRAMPOLINE mapping is identical in all user page tables
- id: uvmunmap-invariant-1
  text: page table consistency
- id: walk-invariant-1
  text: Sv39 structure integrity
- id: walkaddr-invariant-1
  text: no page table mutation
dependencies:
- kernel/boot
- kernel/headers
- kernel/memory
rely:
- 'copyin.rely.callable_interfaces: walkaddr, memmove'
- 'copyin.rely.lock_assumptions: none'
- 'copyin.rely.resource_assumptions: dst buffer is valid kernel memory'
- 'copyin.rely.state_assumptions: current process pagetable is valid'
- 'copyinstr.rely.callable_interfaces: walkaddr'
- 'copyinstr.rely.lock_assumptions: none'
- 'copyinstr.rely.resource_assumptions: dst buffer is valid kernel memory of at least
  max bytes'
- 'copyinstr.rely.state_assumptions: current process pagetable is valid'
- 'copyout.rely.callable_interfaces: walkaddr, memmove'
- 'copyout.rely.lock_assumptions: none'
- 'copyout.rely.resource_assumptions: src buffer is valid kernel memory'
- 'copyout.rely.state_assumptions: current process pagetable is valid'
- 'kalloc.rely.callable_interfaces: kmem.freelist (global)'
- 'kalloc.rely.lock_assumptions: acquires kmem.lock'
- 'kalloc.rely.resource_assumptions: at least one free page exists (or NULL is returned)'
- 'kalloc.rely.state_assumptions: freelist has been initialized by kinit'
- 'kfree.rely.callable_interfaces: kmem.freelist (global)'
- 'kfree.rely.lock_assumptions: acquires kmem.lock'
- 'kfree.rely.resource_assumptions: the page was previously obtained from kalloc'
- 'kfree.rely.state_assumptions: freelist has been initialized by kinit'
- 'kinit.rely.callable_interfaces: end (linker symbol)'
- 'kinit.rely.lock_assumptions: no locks required (single-hart init)'
- 'kinit.rely.resource_assumptions: physical memory is contiguous from end to PHYSTOP'
- 'kinit.rely.state_assumptions: end is defined by the linker script'
- 'kinit.rely.state_assumptions: kernel image occupies [0x80000000 .. end)'
- 'kvmmake.rely.callable_interfaces: kalloc (to allocate page table pages)'
- 'kvmmake.rely.callable_interfaces: kvmmap (to install mappings)'
- 'kvmmake.rely.lock_assumptions: none (init only)'
- 'kvmmake.rely.resource_assumptions: sufficient free pages for 3-level page table'
- 'kvmmake.rely.state_assumptions: physical memory is accessible from 0x80000000'
- 'kvmmap.rely.callable_interfaces: walk (to locate PTE slot)'
- 'kvmmap.rely.lock_assumptions: none'
- 'kvmmap.rely.resource_assumptions: physical pages for intermediate PT levels are
  allocated'
- 'kvmmap.rely.state_assumptions: target pagetable is valid (allocated)'
- physical memory range is provided by boot stage
- 'uvmalloc.rely.callable_interfaces: kalloc, kvmmap, walk'
- 'uvmalloc.rely.lock_assumptions: none'
- 'uvmalloc.rely.resource_assumptions: free pages available for new PTEs and data
  pages'
- 'uvmalloc.rely.state_assumptions: pagetable is a valid user page table'
- 'uvmcopy.rely.callable_interfaces: kalloc, walk, memmove'
- 'uvmcopy.rely.lock_assumptions: none'
- 'uvmcopy.rely.resource_assumptions: enough free pages to copy all mappings'
- 'uvmcopy.rely.state_assumptions: old pagetable is a valid user page table'
- 'uvmcreate.rely.callable_interfaces: kalloc'
- 'uvmcreate.rely.lock_assumptions: none'
- 'uvmcreate.rely.resource_assumptions: one free page available'
- 'uvmcreate.rely.state_assumptions: kalloc is available'
- 'uvmdealloc.rely.callable_interfaces: uvmunmap'
- 'uvmdealloc.rely.lock_assumptions: none'
- 'uvmdealloc.rely.resource_assumptions: none'
- 'uvmdealloc.rely.state_assumptions: pages in [newsz, oldsz) are mapped'
- 'uvmdealloc.rely.state_assumptions: pagetable is valid'
- 'uvmfree.rely.callable_interfaces: uvmunmap, kfree'
- 'uvmfree.rely.lock_assumptions: none'
- 'uvmfree.rely.resource_assumptions: none'
- 'uvmfree.rely.state_assumptions: no other references to the page table exist'
- 'uvmfree.rely.state_assumptions: pagetable is a valid user page table'
- 'uvminit.rely.callable_interfaces: kalloc, kvmmap'
- 'uvminit.rely.lock_assumptions: none'
- 'uvminit.rely.resource_assumptions: free pages available for trapframe'
- 'uvminit.rely.state_assumptions: pagetable is empty (just allocated via uvmcreate)'
- 'uvmunmap.rely.callable_interfaces: walk, kfree'
