algorithm_intent: Implement the memory stage contract while preserving the declared
  xv6 module boundaries.
concurrency:
  module:
    module: kernel/memory
    shared_state:
    - physical page freelist (kmem.freelist)
    - allocation counter
    lock_types:
    - spinlock (kmem.lock)
    lock_order:
    - kmem.lock (single lock, no nesting)
    atomic_sections:
    - freelist push/pop under kmem.lock
    interrupt_rules:
    - push_off/pop_off around freelist mutations
    rely:
    - physical memory range is provided by boot stage
    guarantee:
    - every allocated page is 4096-byte aligned and zeroed
    - no page is simultaneously allocated and on freelist
    wait_wakeup_rules: []
    forbidden_patterns:
    - accessing freelist without holding kmem.lock
    - allocating or freeing pages before kinit
    - using pages returned by kfree after the call
  operations:
    copyin:
      atomicity: per-page copy
      lock_order: []
      interrupt_state: interrupts enabled
      wait_wakeup_rules: []
    copyinstr:
      atomicity: per-byte copy after address validation
      lock_order: []
      interrupt_state: interrupts enabled
      wait_wakeup_rules: []
    copyout:
      atomicity: per-page copy
      lock_order: []
      interrupt_state: interrupts enabled
      wait_wakeup_rules: []
    kalloc:
      atomicity: freelist pop under spinlock
      lock_order:
      - kmem.lock
      interrupt_state: lock is push_off / pop_off
      wait_wakeup_rules: []
    kfree:
      atomicity: freelist push under spinlock
      lock_order:
      - kmem.lock
      interrupt_state: lock is push_off / pop_off
      wait_wakeup_rules: []
    kinit:
      atomicity: init runs single-threaded
      lock_order: []
      interrupt_state: interrupts disabled during init
      wait_wakeup_rules: []
    kvmmake:
      atomicity: init only
      lock_order: []
      interrupt_state: disabled
      wait_wakeup_rules: []
    kvmmap:
      atomicity: single-threaded
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
    uvmalloc:
      atomicity: non-atomic across page allocations
      lock_order: []
      interrupt_state: interrupts enabled
      wait_wakeup_rules: []
    uvmcopy:
      atomicity: not atomic (may be rescheduled during copy)
      lock_order: []
      interrupt_state: interrupts enabled during copy
      wait_wakeup_rules: []
    uvmcreate:
      atomicity: single allocation
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
    uvmdealloc:
      atomicity: non-atomic
      lock_order: []
      interrupt_state: interrupts enabled
      wait_wakeup_rules: []
    uvmfree:
      atomicity: non-atomic
      lock_order: []
      interrupt_state: interrupts enabled
      wait_wakeup_rules: []
    uvminit:
      atomicity: init only
      lock_order: []
      interrupt_state: disabled
      wait_wakeup_rules: []
    uvmunmap:
      atomicity: per-page operations
      lock_order: []
      interrupt_state: interrupts enabled
      wait_wakeup_rules: []
    walk:
      atomicity: single read-path; alloc path not atomic
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
    walkaddr:
      atomicity: read-only
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
