algorithm_intent: Implement the syscall stage contract while preserving the declared
  xv6 module boundaries.
concurrency:
  module:
    module: kernel/syscall
    shared_state:
    - syscall dispatch table (array of function pointers)
    lock_types:
    - none (dispatch is non-preemptible on single hart)
    lock_order: []
    atomic_sections:
    - fd lookup and validation must observe a stable descriptor binding
    - user pointer validation via walkaddr is atomic per-page
    interrupt_rules:
    - interrupts disabled during trap handling
    - do not hold scheduler-global locks across user buffer validation
    wait_wakeup_rules: []
    rely:
    - trap handler (usertrap) calls syscall() with validated sepc
    - argument registers (a0-a5) are correctly saved to trapframe
    guarantee:
    - every user pointer is validated before kernel dereference
    - syscall number is bounds-checked before dispatch
    forbidden_patterns:
    - dereferencing a user pointer without prior walkaddr check
    - returning to usermode without setting sepc += 4 on success
    - calling syscall handlers directly (bypassing the dispatcher)
  operations:
    argaddr:
      atomicity: single register read
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
    argint:
      atomicity: single register read
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
    fetchaddr:
      atomicity: single word fetch after address validation
      lock_order: []
      interrupt_state: interrupts enabled
      wait_wakeup_rules: []
    fetchstr:
      atomicity: per-word fetch after address validation
      lock_order: []
      interrupt_state: interrupts enabled
      wait_wakeup_rules: []
    sys_exit:
      atomicity: exit holds necessary locks
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
    sys_fork:
      atomicity: fork holds its own locks
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
    sys_sbrk:
      atomicity: growproc is non-atomic
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
    sys_wait:
      atomicity: wait holds necessary locks
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
    sys_write:
      atomicity: syscall is non-preemptible on a single hart
      lock_order: []
      interrupt_state: interrupts disabled during trap handling
      wait_wakeup_rules: []
    syscall:
      atomicity: syscall is non-preemptible
      lock_order: []
      interrupt_state: interrupts disabled during trap
      wait_wakeup_rules: []
