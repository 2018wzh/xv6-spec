id: kernel/console
module: kernel/console
level: 3
purpose: 'Console input and output layer: provides line-buffered input with editing
  (backspace, ctrl-u, ctrl-d, ctrl-p), output via UART (consputc), and the consoleintr
  callback for UART interrupt handling.'
owns:
- kernel/console.c
interface:
- name: consoleinit
  pre:
  - called once during boot
  post:
  - console is ready
  errors:
  - none
  properties:
  - id: consoleinit-property-1
    text: 'guarantee.returns: void'
  - id: consoleinit-property-2
    text: 'guarantee.side_effects: cons.lock initialized'
- name: consoleintr
  pre:
  - called from interrupt context
  post:
  - input buffer reflects the new character
  errors:
  - none
  properties:
  - id: consoleintr-property-1
    text: 'guarantee.returns: void'
  - id: consoleintr-property-2
    text: 'guarantee.side_effects: character added to input buffer'
  - id: consoleintr-property-3
    text: 'guarantee.side_effects: line may be completed'
  - id: consoleintr-property-4
    text: 'guarantee.side_effects: readers may be woken'
- name: consoleread
  pre: []
  post: []
  errors:
  - none
  properties:
  - id: consoleread-property-1
    text: 'guarantee.returns.int: number of bytes read, or -1 on error'
  - id: consoleread-property-2
    text: 'guarantee.side_effects: data copied to user buffer'
- name: consolewrite
  pre: []
  post: []
  errors:
  - none (always succeeds)
  properties:
  - id: consolewrite-property-1
    text: 'guarantee.returns.int: n (always succeeds)'
  - id: consolewrite-property-2
    text: 'guarantee.side_effects: all n bytes written to UART'
- name: consputc
  pre: []
  post: []
  errors:
  - none
  properties:
  - id: consputc-property-1
    text: 'guarantee.returns: void'
  - id: consputc-property-2
    text: 'guarantee.side_effects: character written to UART'
properties:
- id: module-property-1
  text: console does not access user pointers directly; consoleread/consolewrite use
    copyin/copyout
- id: module-property-2
  text: console is initialized once (consoleinit)
- id: module-property-3
  text: input buffer is fixed-size (INPUT_BUF)
- id: module-property-4
  text: unit tests for all exported functions
- id: module-property-5
  text: integration tests with dependent modules
errors:
- consoleread blocks until a full line is available or EOF
- none
- none (always succeeds)
state:
  stage: device
  owned_state:
  - input circular buffer (cons.buf)
  - cons.lock spinlock
  - read/write indices
  resource_lifetime:
  - console is initialized once (consoleinit)
  - input buffer is fixed-size (INPUT_BUF)
preconditions:
- called from interrupt context
- called once during boot
postconditions:
- console is ready
- input buffer reflects the new character
invariants:
- id: invariant-1
  text: console input is line-buffered (delivered on newline or ctrl-d)
- id: invariant-2
  text: backspace sends BACKSPACE marker
- id: invariant-3
  text: ctrl-p prints process list via procdump
dependencies:
- kernel/console
rely:
- 'consoleinit.rely.callable_interfaces: initlock (from kernel/lock)'
- 'consoleinit.rely.lock_assumptions: none'
- 'consoleinit.rely.resource_assumptions: sufficient resources available'
- 'consoleintr.rely.callable_interfaces: procdump (from kernel/process)'
- 'consoleintr.rely.callable_interfaces: wakeup (from kernel/process)'
- 'consoleintr.rely.lock_assumptions: none'
- 'consoleintr.rely.resource_assumptions: sufficient resources available'
- 'consoleread.rely.callable_interfaces: copyout (from kernel/memory)'
- 'consoleread.rely.callable_interfaces: sleep/wakeup (from kernel/process)'
- 'consoleread.rely.lock_assumptions: none'
- 'consoleread.rely.resource_assumptions: sufficient resources available'
- 'consolewrite.rely.callable_interfaces: consputc (internal)'
- 'consolewrite.rely.callable_interfaces: copyin (from kernel/memory)'
- 'consolewrite.rely.lock_assumptions: none'
- 'consolewrite.rely.resource_assumptions: sufficient resources available'
- 'consputc.rely.callable_interfaces: uartputc_sync (from kernel/uart)'
- 'consputc.rely.lock_assumptions: none'
- 'consputc.rely.resource_assumptions: sufficient resources available'
- 'module: copyin/copyout (from kernel/memory)'
- 'module: sleep/wakeup (from kernel/process)'
- 'module: uartputc_sync (from kernel/uart)'
guarantee:
- 'consoleinit.guarantee.returns: void'
- 'consoleinit.guarantee.side_effects: cons.lock initialized'
- 'consoleintr.guarantee.returns: void'
- 'consoleintr.guarantee.side_effects: character added to input buffer'
- 'consoleintr.guarantee.side_effects: line may be completed'
- 'consoleintr.guarantee.side_effects: readers may be woken'
- 'consoleread.guarantee.returns.int: number of bytes read, or -1 on error'
- 'consoleread.guarantee.side_effects: data copied to user buffer'
- 'consolewrite.guarantee.returns.int: n (always succeeds)'
- 'consolewrite.guarantee.side_effects: all n bytes written to UART'
- 'consputc.guarantee.returns: void'
- 'consputc.guarantee.side_effects: character written to UART'
- 'exported: consoleinit'
- 'exported: consoleintr'
- 'exported: consoleread'
- 'exported: consolewrite'
- 'exported: consputc'
algorithm_intent: Implement the device stage contract while preserving the declared
  xv6 module boundaries.
concurrency:
  module: {}
  operations:
    consoleinit:
      atomicity: single operation
      lock_order: []
      interrupt_state: enabled
      wait_wakeup_rules: []
    consoleintr:
      atomicity: single operation
      lock_order: []
      interrupt_state: enabled
      wait_wakeup_rules: []
    consoleread:
      atomicity: single operation
      lock_order: []
      interrupt_state: enabled
      wait_wakeup_rules:
      - sleeps on &cons until a line is ready or EOF
    consolewrite:
      atomicity: single operation
      lock_order: []
      interrupt_state: enabled
      wait_wakeup_rules: []
    consputc:
      atomicity: single operation
      lock_order: []
      interrupt_state: enabled
      wait_wakeup_rules: []
