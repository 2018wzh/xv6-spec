algorithm_intent: Implement the process stage contract while preserving the declared
  xv6 module boundaries.
concurrency:
  module:
    module: kernel/process
    shared_state:
    - process table (proc[NPROC])
    - wait_lock
    lock_types:
    - spinlock (struct spinlock)
    lock_order:
    - p->lock before wait_lock
    - never acquire p->lock while holding wait_lock
    atomic_sections:
    - process state transitions (via p->lock)
    - scheduler context switch (swtch)
    interrupt_rules:
    - interrupts disabled while holding p->lock
    - push_off/pop_off around proc state mutations
    wait_wakeup_rules:
    - sleep(chan, lock) releases lock and blocks until wakeup(chan)
    - wakeup(chan) wakes all sleepers on chan
    - wakeup must be called with the same lock held that sleep was called with
    rely:
    - timer interrupts drive scheduler
    - swtch saves/restores callee-saved regs
    guarantee:
    - process state transitions are atomic
    - swtch never returns to a freed process
    forbidden_patterns:
    - accessing p->state without holding p->lock
    - holding p->lock across swtch
    - sched() called without p->lock held
  operations:
    allocproc:
      atomicity: proc table scan under p->lock
      lock_order:
      - p->lock (per-slot)
      interrupt_state: push_off/pop_off
      wait_wakeup_rules: []
    exit:
      atomicity: state transitions under locks
      lock_order:
      - p->lock -> wait_lock
      interrupt_state: push_off/pop_off
      wait_wakeup_rules:
      - wakeup(parent) on exit
    fork:
      atomicity: non-atomic (copy may span timer interrupts)
      lock_order:
      - p->lock (on child during setup)
      interrupt_state: push_off/pop_off around critical updates
      wait_wakeup_rules: []
    freeproc:
      atomicity: under p->lock
      lock_order:
      - p->lock
      interrupt_state: push_off/pop_off
      wait_wakeup_rules: []
    growproc:
      atomicity: non-atomic across page operations
      lock_order: []
      interrupt_state: interrupts enabled
      wait_wakeup_rules: []
    proc_init:
      atomicity: init only
      lock_order: []
      interrupt_state: disabled
      wait_wakeup_rules: []
    scheduler:
      atomicity: per-slot lock + swtch
      lock_order:
      - p->lock
      interrupt_state: push_off before acquire
      wait_wakeup_rules: []
    sleep:
      atomicity: lock release + state change is atomic
      lock_order:
      - p->lock acquired, then lk released
      interrupt_state: push_off/pop_off
      wait_wakeup_rules:
      - sleep(chan, lk) blocks current process on chan
    swtch:
      atomicity: whole function is the context switch
      lock_order: []
      interrupt_state: must be called with interrupts off
      wait_wakeup_rules: []
    userinit:
      atomicity: init only
      lock_order: []
      interrupt_state: interrupts disabled during init
      wait_wakeup_rules: []
    wait:
      atomicity: reaping under wait_lock
      lock_order:
      - wait_lock -> child p->lock
      interrupt_state: push_off/pop_off
      wait_wakeup_rules:
      - sleep(current, wait_lock)
    wakeup:
      atomicity: per-process wake under p->lock
      lock_order:
      - p->lock (per process)
      interrupt_state: push_off/pop_off
      wait_wakeup_rules:
      - wakeup on chan causes sleep on chan to return
    yield_cpu:
      atomicity: sched does the context switch
      lock_order:
      - p->lock
      interrupt_state: acquires lock with push_off
      wait_wakeup_rules: []
