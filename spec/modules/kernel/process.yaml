- id: invariant-2
  text: RUNNABLE processes have valid pagetable and trapframe
- id: invariant-3
  text: only one process is RUNNING per hart
- id: invariant-4
  text: process 0 is the scheduler context
- id: invariant-5
  text: a parent must not be freed before all children exit
- id: allocproc-invariant-1
  text: proc table size unchanged
- id: exit-invariant-1
  text: no process is orphaned
- id: fork-invariant-1
