id: kernel/process
module: kernel/process
level: 3
purpose: 'Process abstraction: process table, per-process state, kernel thread context,
  round-robin scheduler, and lifecycle operations (fork, exit, wait, sleep, wakeup).'
owns:
- kernel/process.c
- kernel/swtch.S
- tests/generated/kernel/process
interface:
- name: allocproc
  pre:
  - called with interrupts enabled
  post:
  - returned proc has valid trapframe pointer
  errors:
  - returns NULL if no free slot
  properties:
  - id: allocproc-property-1
    text: proc table size unchanged
  - id: allocproc-property-2
    text: 'guarantee.returns: struct proc * on success'
  - id: allocproc-property-3
    text: 'guarantee.returns: NULL if all NPROC slots are in use'
  - id: allocproc-property-4
    text: 'guarantee.side_effects: one proc slot marked USED'
  - id: allocproc-property-5
    text: 'guarantee.side_effects: trapframe allocated and zeroed'
  - id: allocproc-property-6
    text: 'guarantee.side_effects: kernel stack top set'
  - id: allocproc-property-7
    text: 'guarantee.emitted_events: none'
- name: exit
  pre:
  - called from usermode or kernel
  post:
  - process is ZOMBIE; resources freed by parent wait
  errors:
  - never returns; unrecoverable
  properties:
  - id: exit-property-1
    text: no process is orphaned
  - id: exit-property-2
    text: 'guarantee.returns: never returns'
  - id: exit-property-3
    text: 'guarantee.side_effects: process state set to ZOMBIE'
  - id: exit-property-4
    text: 'guarantee.side_effects: parent woken (if sleeping in wait)'
  - id: exit-property-5
    text: 'guarantee.side_effects: children reparented to init'
  - id: exit-property-6
    text: 'guarantee.side_effects: yields CPU via sched'
  - id: exit-property-7
    text: 'guarantee.emitted_events: none'
- name: fork
  pre:
  - called from usermode via sys_fork
  post:
  - parent and child are distinct RUNNABLE processes
  errors:
  - returns -1 if allocproc or uvmcopy fails
  - cleans up partial state on failure
  properties:
  - id: fork-property-1
    text: process table capacity not exceeded
  - id: fork-property-2
    text: no shared writable memory
  - id: fork-property-3
    text: 'guarantee.returns: child PID (> 0) to parent'
  - id: fork-property-4
    text: 'guarantee.returns: 0 to child'
  - id: fork-property-5
    text: 'guarantee.returns: -1 on failure'
  - id: fork-property-6
    text: 'guarantee.side_effects: child process created with copied memory'
  - id: fork-property-7
    text: 'guarantee.side_effects: child state set to RUNNABLE'
  - id: fork-property-8
    text: 'guarantee.emitted_events: none'
- name: freeproc
  pre:
  - process is ZOMBIE
  - caller holds p->lock
  post:
  - process slot is reusable
  errors:
  - none (always succeeds)
  properties:
  - id: freeproc-property-1
    text: no resource leak
  - id: freeproc-property-2
    text: 'guarantee.returns: void'
  - id: freeproc-property-3
    text: 'guarantee.side_effects: user pagetable freed'
  - id: freeproc-property-4
    text: 'guarantee.side_effects: trapframe page freed'
  - id: freeproc-property-5
    text: 'guarantee.side_effects: kernel stack freed'
  - id: freeproc-property-6
    text: 'guarantee.side_effects: process state set to UNUSED'
  - id: freeproc-property-7
    text: 'guarantee.emitted_events: none'
- name: growproc
  pre:
  - n may be positive or negative
  post:
  - process->sz updated accordingly
  errors:
  - returns -1 if uvmalloc fails
  - returns -1 if shrinking below 0
  properties:
  - id: growproc-property-1
    text: max user address < PLIC (or other device boundary)
  - id: growproc-property-2
    text: 'guarantee.returns: 0 on success'
  - id: growproc-property-3
    text: 'guarantee.returns: -1 on failure (e.g., out of memory)'
  - id: growproc-property-4
    text: 'guarantee.side_effects: process address space expanded or shrunk'
  - id: growproc-property-5
    text: 'guarantee.emitted_events: none'
- name: proc_init
  pre:
  - called once during kernel init
  post:
  - proc table is consistent
  errors:
  - none
  properties:
  - id: proc_init-property-1
    text: no stale proc state
  - id: proc_init-property-2
    text: 'guarantee.returns: void'
  - id: proc_init-property-3
    text: 'guarantee.side_effects: all proc[NPROC] zeroed'
  - id: proc_init-property-4
    text: 'guarantee.side_effects: all proc[NPROC].lock initialized'
  - id: proc_init-property-5
    text: 'guarantee.emitted_events: none'
- name: scheduler
  pre:
  - called from process 0 (scheduler context)
  post:
  - never terminates
  errors:
  - panics if swtch misbehaves
  properties:
  - id: scheduler-property-1
    text: exactly one process is RUNNING at a time
  - id: scheduler-property-2
    text: 'guarantee.returns: never returns (infinite loop)'
  - id: scheduler-property-3
    text: 'guarantee.side_effects: selects next RUNNABLE process'
  - id: scheduler-property-4
    text: 'guarantee.side_effects: transfers control via swtch'
  - id: scheduler-property-5
    text: 'guarantee.emitted_events: none'
- name: sleep
  pre:
  - lk is a valid spinlock
  - chan is a non-NULL wait channel identifier
  post:
  - process is eventually rescheduled after wakeup
  errors:
  - panics if lk is not held
  properties:
  - id: sleep-property-1
    text: sleep+wakeup pairing integrity
  - id: sleep-property-2
    text: 'guarantee.returns: void (returns after wakeup)'
  - id: sleep-property-3
    text: 'guarantee.side_effects: current process state set to SLEEPING'
  - id: sleep-property-4
    text: 'guarantee.side_effects: lk released atomically'
  - id: sleep-property-5
    text: 'guarantee.side_effects: process blocked until wakeup'
  - id: sleep-property-6
    text: 'guarantee.emitted_events: none'
- name: swtch
  pre:
  - called from sched() with interrupts disabled
  - '*old and *new are valid struct context'
  post:
  - execution continues in new context
  errors:
  - undefined behavior if context pointers invalid
  properties:
  - id: swtch-property-1
    text: no register leakage between contexts
  - id: swtch-property-2
    text: 'guarantee.returns: void (but returns in new context''s stack frame)'
  - id: swtch-property-3
    text: 'guarantee.side_effects: callee-saved registers saved to *old'
  - id: swtch-property-4
    text: 'guarantee.side_effects: callee-saved registers restored from *new'
  - id: swtch-property-5
    text: 'guarantee.side_effects: ra (return address) changed to new context'
  - id: swtch-property-6
    text: 'guarantee.emitted_events: none'
- name: userinit
  pre:
  - called once during kernel init, after trap_init
  post:
  - at least one RUNNABLE process exists
  errors:
  - panics if allocproc fails or memory is exhausted
  properties:
  - id: userinit-property-1
    text: process 1 (init) is never killed
  - id: userinit-property-2
    text: 'guarantee.returns: void'
  - id: userinit-property-3
    text: 'guarantee.side_effects: first user process created (pid 1)'
  - id: userinit-property-4
    text: 'guarantee.side_effects: process state set to RUNNABLE'
  - id: userinit-property-5
    text: 'guarantee.side_effects: initial user code loaded into process memory'
  - id: userinit-property-6
    text: 'guarantee.emitted_events: none'
- name: wait
  pre:
  - called from usermode via sys_wait
  post:
  - exited child is fully reaped
  errors:
  - returns -1 if caller has no children
  properties:
  - id: wait-property-1
    text: proc table maintains at least one free slot for parent
  - id: wait-property-2
    text: 'guarantee.returns: child PID on success'
  - id: wait-property-3
    text: 'guarantee.returns: -1 if no children exist'
  - id: wait-property-4
    text: 'guarantee.side_effects: child resources freed (pagetable, trapframe, etc.)'
  - id: wait-property-5
    text: 'guarantee.side_effects: child slot returned to free pool'
  - id: wait-property-6
    text: 'guarantee.emitted_events: none'
- name: wakeup
  pre:
  - chan is the same wait channel used in sleep()
  - caller holds the lock that was passed to sleep()
  post:
  - all processes on chan are RUNNABLE or RUNNING
  errors:
  - no-op if no processes are sleeping on chan
  properties:
  - id: wakeup-property-1
    text: process state consistency
  - id: wakeup-property-2
    text: 'guarantee.returns: void'
  - id: wakeup-property-3
    text: 'guarantee.side_effects: all SLEEPING processes on chan become RUNNABLE'
  - id: wakeup-property-4
    text: 'guarantee.emitted_events: none'
- name: yield_cpu
  pre:
  - current process is valid
  post:
  - process is eventually rescheduled
  errors:
  - panics if not holding p->lock
  properties:
  - id: yield_cpu-property-1
    text: yield is non-preemptive (voluntary)
  - id: yield_cpu-property-2
    text: 'guarantee.returns: void (but may return in the future when rescheduled)'
  - id: yield_cpu-property-3
    text: 'guarantee.side_effects: current process becomes RUNNABLE'
  - id: yield_cpu-property-4
    text: 'guarantee.side_effects: next process becomes RUNNING'
  - id: yield_cpu-property-5
    text: 'guarantee.emitted_events: none'
