id: kernel/file
module: kernel/file
level: 3
purpose: File descriptor table and file object management. Provides allocation, reference
  counting, duplication, closing, metadata query, and typed read/write dispatch (pipe,
  inode, device).
owns:
- kernel/file.c
- tests/generated/kernel/file
interface:
- name: filealloc
  pre:
  - ftable is initialized
  post:
  - allocated file has ref==1 and is not yet typed
  errors:
  - none
  properties:
  - id: filealloc-property-1
    text: 'guarantee.returns: struct file* on success'
  - id: filealloc-property-2
    text: 'guarantee.returns: 0 if table is full'
  - id: filealloc-property-3
    text: 'guarantee.side_effects: file ref count set to 1'
- name: fileclose
  pre:
  - f->ref >= 1
  post:
  - file is freed and available for reallocation
  errors:
  - none
  properties:
  - id: fileclose-property-1
    text: 'guarantee.returns: void'
  - id: fileclose-property-2
    text: 'guarantee.side_effects: f->ref decremented'
  - id: fileclose-property-3
    text: 'guarantee.side_effects: underlying resource freed if ref reaches 0'
  - id: fileclose-property-4
    text: 'guarantee.side_effects: f->type set to FD_NONE'
- name: filedup
  pre:
  - f->ref >= 1
  post:
  - f->ref increased by 1
  errors:
  - none
  properties:
  - id: filedup-property-1
    text: 'guarantee.returns: struct file* (same as input)'
  - id: filedup-property-2
    text: 'guarantee.side_effects: f->ref incremented'
- name: fileinit
  pre:
  - called once during boot
  post:
  - file table ready for allocation
  errors:
  - none
  properties:
  - id: fileinit-property-1
    text: 'guarantee.returns: void'
  - id: fileinit-property-2
    text: 'guarantee.side_effects: ftable.lock initialized'
- name: fileread
  pre:
  - file must be readable
  post:
  - bytes copied to user buffer
  errors:
  - returns -1 if file is not readable
  properties:
  - id: fileread-property-1
    text: 'guarantee.returns.int: number of bytes read, or -1 on error'
  - id: fileread-property-2
    text: 'guarantee.side_effects: file offset advanced by bytes read (for FD_INODE)'
- name: filestat
  pre:
  - file type is FD_INODE or FD_DEVICE
  post:
  - user receives valid stat data
  errors:
  - returns -1 if not FD_INODE/DEVICE or copyout fails
  properties:
  - id: filestat-property-1
    text: 'guarantee.returns.int: 0 on success, -1 on failure'
  - id: filestat-property-2
    text: 'guarantee.side_effects: stat data copied to user address'
- name: filewrite
  pre:
  - file must be writable
  post:
  - bytes written to file
  errors:
  - returns -1 if file is not writable
  properties:
  - id: filewrite-property-1
    text: 'guarantee.returns.int: number of bytes written, or -1 on error'
  - id: filewrite-property-2
    text: 'guarantee.side_effects: file offset advanced by bytes written (for FD_INODE)'
  - id: filewrite-property-3
    text: 'guarantee.side_effects: new blocks may be allocated'
  - id: filewrite-property-4
    text: 'guarantee.side_effects: log transactions for inode writes'
properties:
- id: module-property-1
  text: readable/writable flags gate all read/write access
- id: module-property-2
  text: device major number bounds-checked before dispatch
- id: module-property-3
  text: fileclose calls iput on the underlying inode when ref reaches 0
- id: module-property-4
  text: pipe files are closed via pipeclose
- id: module-property-5
  text: file alloc/dup/close cycle
- id: module-property-6
  text: read/write dispatch by type
- id: module-property-7
  text: ref count correctness
errors:
- filealloc returns 0 when table is full
- fileclose panics if ref < 1
- fileread/filewrite return -1 on invalid access
- none
- returns -1 if file is not readable
- returns -1 if file is not writable
- returns -1 if not FD_INODE/DEVICE or copyout fails
state:
  stage: filesystem
  owned_state:
  - file table (ftable.file[NFILE])
  - ftable.lock spinlock
  - device switch table (devsw[NDEV])
  resource_lifetime:
  - fileclose calls iput on the underlying inode when ref reaches 0
  - pipe files are closed via pipeclose
preconditions:
- called once during boot
- f->ref >= 1
- file must be readable
- file must be writable
- file type is FD_INODE or FD_DEVICE
- ftable is initialized
postconditions:
- allocated file has ref==1 and is not yet typed
- bytes copied to user buffer
- bytes written to file
- f->ref increased by 1
- file is freed and available for reallocation
- file table ready for allocation
- user receives valid stat data
invariants:
- id: invariant-1
  text: every allocated file has ref >= 1
- id: invariant-2
  text: file type is one of FD_NONE, FD_PIPE, FD_INODE, FD_DEVICE
- id: invariant-3
  text: file offset is only meaningful for FD_INODE
- id: invariant-4
  text: major device number is validated against NDEV
dependencies:
- kernel/file
