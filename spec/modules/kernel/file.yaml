algorithm_intent: Implement the filesystem stage contract while preserving the declared
  xv6 module boundaries.
concurrency:
  module: {}
  operations:
    filealloc:
      atomicity: ftable.lock for allocation/refcount, per-inode lock for inode ops
      lock_order: []
      interrupt_state: enabled
      wait_wakeup_rules: []
    fileclose:
      atomicity: ftable.lock for allocation/refcount, per-inode lock for inode ops
      lock_order: []
