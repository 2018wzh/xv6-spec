- 'filestat.rely.state_assumptions: ftable is initialized'
- 'filewrite.rely.callable_interfaces: begin_op/end_op (from kernel/log)'
- 'filewrite.rely.callable_interfaces: devsw write (device driver)'
- 'filewrite.rely.callable_interfaces: ilock/iunlock (from kernel/fs)'
- 'filewrite.rely.callable_interfaces: pipewrite (from kernel/pipe)'
- 'filewrite.rely.callable_interfaces: writei (from kernel/fs)'
- 'filewrite.rely.lock_assumptions: acquires ftable.lock for table operations'
- 'filewrite.rely.resource_assumptions: sufficient resources available'
