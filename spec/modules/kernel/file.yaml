- 'fileread.rely.callable_interfaces: devsw read (device driver)'
- 'fileread.rely.callable_interfaces: ilock/iunlock (from kernel/fs)'
- 'fileread.rely.callable_interfaces: piperead (from kernel/pipe)'
- 'fileread.rely.callable_interfaces: readi (from kernel/fs)'
- 'fileread.rely.lock_assumptions: acquires ftable.lock for table operations'
- 'fileread.rely.resource_assumptions: sufficient resources available'
- 'fileread.rely.state_assumptions: ftable is initialized'
- 'filestat.rely.callable_interfaces: copyout (from kernel/memory)'
