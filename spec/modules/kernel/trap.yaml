- 'devintr.guarantee.returns: 0 if not a device interrupt'
- 'devintr.guarantee.returns: 1 if device interrupt handled'
- 'devintr.guarantee.side_effects: SBI timer reprogrammed for next tick'
- 'exported: devintr'
- 'exported: kerneltrap'
- 'exported: kernelvec'
- 'exported: trampoline'
- 'exported: trap_init'
- 'exported: usertrap'
- 'exported: usertrapret'
- 'kerneltrap.guarantee.emitted_events: none'
- 'kerneltrap.guarantee.returns: void (returns via sret)'
- 'kerneltrap.guarantee.side_effects: sepc, scause, sstatus saved/restored'
- 'kerneltrap.guarantee.side_effects: timer interrupt handled if applicable'
- 'kernelvec.guarantee.emitted_events: none'
- 'kernelvec.guarantee.returns: void (returns via sret to interrupted code)'
- 'kernelvec.guarantee.side_effects: all registers saved to and restored from kernel
  stack'
- 'kernelvec.guarantee.side_effects: sstatus/sepc saved and restored'
- 'kernelvec.guarantee.side_effects: trap handled via kerneltrap'
- timer interrupts fire at ~1 Hz
- 'trampoline.guarantee.emitted_events: none'
- 'trampoline.guarantee.returns: userret: never returns directly; executes sret to
  U-mode'
- 'trampoline.guarantee.returns: uservec: never returns directly; jumps to usertrap'
- 'trampoline.guarantee.side_effects: userret: restores all 32 user registers from
  trapframe, switches satp to user page table, executes sret'
- 'trampoline.guarantee.side_effects: uservec: saves all 32 user registers to trapframe,
  loads kernel satp/stack/trap handler address from trapframe, switches satp to kernel
  page table'
- trap frame is consistent after save
- 'trap_init.guarantee.emitted_events: none'
- 'trap_init.guarantee.returns: void'
- 'trap_init.guarantee.side_effects: kernelvec installed as trap handler'
- 'trap_init.guarantee.side_effects: stvec set to kernelvec address'
- 'usertrap.guarantee.emitted_events: none'
- 'usertrap.guarantee.returns: void (always calls usertrapret)'
- 'usertrap.guarantee.side_effects: on syscall: sepc += 4, syscall()'
- 'usertrap.guarantee.side_effects: on timer: yield()'
- 'usertrap.guarantee.side_effects: sepc, scause, stval saved'
- 'usertrap.guarantee.side_effects: sstatus.SPP restored'
- 'usertrap.guarantee.side_effects: user registers saved to trapframe'
- 'usertrapret.guarantee.emitted_events: none'
- 'usertrapret.guarantee.returns: void (jumps to usermode)'
- 'usertrapret.guarantee.side_effects: all user registers restored from trapframe'
- 'usertrapret.guarantee.side_effects: satp set to user page table'
- 'usertrapret.guarantee.side_effects: sret to sepc in U-mode'
- 'usertrapret.guarantee.side_effects: stvec set to uservec (trampoline)'
algorithm_intent: Implement the trap stage contract while preserving the declared
  xv6 module boundaries.
concurrency:
  module:
    module: kernel/trap
    shared_state:
    - stvec (per-hart)
    - sstatus (per-hart)
    - sie (per-hart)
    lock_types:
    - push_off / pop_off (interrupt disable)
    lock_order:
    - push_off before kernel critical sections
    atomic_sections:
    - trap entry/exit (hardware atomic)
    - timer interrupt acknowledge
    interrupt_rules:
    - sie.STIE set for timer interrupts
    - sie.SEIE clear (no external interrupts)
    - sstatus.SIE clear in handler
    rely:
    - SBI provides timer extension
    - hardware delivers timer interrupts
    guarantee:
    - timer interrupts fire at ~1 Hz
    - trap frame is consistent after save
    wait_wakeup_rules: []
    forbidden_patterns:
    - holding a spinlock across usertrapret
    - re-enabling interrupts inside usertrap before yield
  operations:
    devintr:
      atomicity: single ecall
      lock_order: []
      interrupt_state: irrelevant
      wait_wakeup_rules: []
    kerneltrap:
      atomicity: trap entry/exit by hardware
      lock_order: []
      interrupt_state: interrupts disabled throughout
      wait_wakeup_rules: []
    kernelvec:
      atomicity: hardware atomic trap entry/exit
      lock_order: []
      interrupt_state: interrupts disabled on entry (SIE clear in sstatus)
      wait_wakeup_rules: []
    trampoline:
      atomicity: hardware atomic trap entry/exit
      lock_order: []
      interrupt_state: interrupts disabled during trap handling
      wait_wakeup_rules: []
    trap_init:
      atomicity: single csrw instruction
      lock_order: []
      interrupt_state: interrupts disabled
      wait_wakeup_rules: []
    usertrap:
      atomicity: single trap handler instance per hart
      lock_order: []
      interrupt_state: interrupts initially disabled
      wait_wakeup_rules: []
    usertrapret:
      atomicity: hardware sret
      lock_order: []
      interrupt_state: disabled; re-enabled by sret
      wait_wakeup_rules: []
