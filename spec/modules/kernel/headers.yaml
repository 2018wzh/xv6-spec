id: kernel/headers
module: kernel/headers
level: 3
purpose: Infrastructure header files and linker scripts for the xv6 kernel. Generates
  all kernel/*.h headers defining types, constants, macros, structs, and function
  declarations, plus the kernel linker script kernel/kernel.ld.
owns:
- kernel/defs.h
- kernel/elf.h
- kernel/kernel.ld
- kernel/memlayout.h
- kernel/param.h
- kernel/proc.h
- kernel/riscv.h
- kernel/spinlock.h
- kernel/types.h
- tests/generated/kernel/headers
interface:
- name: generate_defs_h
  pre:
  - all other kernel/*.h headers exist
  post:
  - kernel/defs.h exists with all kernel API declarations
  errors: []
  properties:
  - id: generate_defs_h-property-1
    text: 'guarantee.declarations.function_declarations: const char *boot_banner(void)'
  - id: generate_defs_h-property-2
    text: 'guarantee.declarations.function_declarations: void console_putchar(int
      c)'
  - id: generate_defs_h-property-3
    text: 'guarantee.declarations.function_declarations: void console_write(const
      char *buf, int n)'
  - id: generate_defs_h-property-4
    text: 'guarantee.declarations.function_declarations: void shutdown(void)'
  - id: generate_defs_h-property-5
