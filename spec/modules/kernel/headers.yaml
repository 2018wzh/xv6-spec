properties:
- id: module-property-1
  text: none (build-time artifacts)
- id: module-property-2
  text: headers are static files, generated once before compilation
- id: module-property-3
  text: header self-consistency (each header compiles standalone)
- id: module-property-4
  text: cross-header consistency (all headers compile together)
- id: module-property-5
  text: linker script produces valid ELF
errors:
- invalid linker script causes link failure
- missing declarations cause compile errors in dependent modules
state:
  stage: boot
  owned_state:
  - none (headers are stateless declarations)
  resource_lifetime:
  - headers are static files, generated once before compilation
preconditions:
- all other kernel/*.h headers exist
- kernel/types.h and kernel/riscv.h exist
- kernel/types.h exists
- kernel/types.h, param.h, riscv.h, spinlock.h exist
- none
postconditions:
- kernel/defs.h exists with all kernel API declarations
- kernel/elf.h exists
- kernel/kernel.ld exists and is valid GNU ld syntax
- kernel/memlayout.h exists with all layout constants
- kernel/param.h exists
- kernel/proc.h exists
- kernel/riscv.h exists with all CSR access macros
- kernel/spinlock.h exists
- kernel/types.h exists and is self-consistent
invariants:
- id: invariant-1
  text: all generated headers are self-consistent
- id: invariant-2
  text: header include order respects dependencies
- id: invariant-3
  text: linker script places .text at 0x80000000
dependencies:
- kernel/headers
rely:
- 'generate_defs_h.rely.state_assumptions: all other headers already generated'
- 'generate_link_ld.rely.state_assumptions: _start is defined in kernel/entry.S'
- 'generate_link_ld.rely.state_assumptions: stack0 size = 4096 * NCPU (NCPU=1 for
  single-hart)'
