id: user
module: user
level: 3
purpose: Aggregate namespace for user-space artifacts generated by the xv6 spec. This
  parent ModuleSpec expands stage-scoped to user/* descendants such as user/programs
  and user/lib.
owns:
- user
interface:
- user/*
properties:
- id: module-property-1
  text: aggregates only U-mode or user-build artifacts
- id: module-property-2
  text: namespace remains stable for all generated user-space artifacts through stage
    full-syscall
- id: module-property-3
  text: architecture slices may reference user as a stage-scoped aggregate
errors:
- none directly; child modules define concrete error semantics
state:
  stage: full-syscall
  owned_state:
  - none (aggregation namespace only)
  resource_lifetime:
  - namespace remains stable for all generated user-space artifacts through stage
    full-syscall
preconditions: []
postconditions: []
invariants:
- id: invariant-1
  text: references to user expand only to active user/* modules at the selected stage
- id: invariant-2
  text: concrete runtime behavior is defined by descendant user/* modules
dependencies:
- kernel/syscall
- kernel/sysfile
rely:
- 'module: kernel/syscall'
- 'module: kernel/sysfile'
guarantee:
- 'exported: user/*'
algorithm_intent: Implement the full-syscall stage contract while preserving the declared
  xv6 module boundaries.
