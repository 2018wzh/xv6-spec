id: toolchain
module: toolchain
level: 2
purpose: Build and run the Linux and freestanding RISC-V CTF readers with reproducible host commands and serial-only QEMU evidence.
owns:
- vos.yaml
- Makefile
- tests/generated/toolchain
interface:
- name: build_ctf_readers
  pre:
  - POSIX make, a host C compiler, a freestanding RISC-V compiler, and matching binutils are available
  post:
  - the Linux reader and freestanding QEMU image are rebuilt from tracked sources
  errors:
  - a missing or incapable compiler fails before publishing a stale artifact
  properties:
  - id: ctf-toolchain-build
    text: a clean build produces both declared reader artifacts from the current commit
- name: run_ctf_qemu
  pre:
  - the generated non-secret fixture image and freestanding guest artifact exist
  post:
  - QEMU runs without graphics and serial output reaches the declared completion marker
  errors:
  - panic, fatal diagnostics, missing completion, and timeout remain distinct failures
  properties:
  - id: ctf-toolchain-qemu
    text: the serial oracle accepts only the complete CTF_BAREMETAL_OK marker and rejects panic or fatal output
properties:
- id: toolchain-deterministic
  text: unchanged sources and compiler identities reproduce the declared artifacts and fixture layout
errors:
- missing tools, failed compilation, invalid images, and QEMU failures are reported without fallback artifacts
state:
  stage: lab1-ctf-warmup
  owned_state:
  - structured build and QEMU commands plus their declared artifacts
  resource_lifetime:
  - build outputs are disposable and never replace tracked source or Spec files
preconditions:
- PATH is explicitly allowed for build and QEMU targets
postconditions:
- vos build and vos run qemu execute only the declared argv projections
invariants:
- id: ctf-toolchain-argv
  text: program and arguments remain separate fields and every cwd and artifact path stays inside the repository
dependencies: []
