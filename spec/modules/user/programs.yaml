properties:
- id: module-property-1
  text: user programs run in U-mode isolated from kernel
- id: module-property-2
  text: init binary is statically linked, loaded once at boot
- id: module-property-3
  text: init boots and prints banner to console
- id: module-property-4
  text: init does not crash or exit
errors:
- init must not exit (system panics if init exits)
- invalid linker script causes link failure
- none (build-time)
- panics if sys_write fails (unexpected)
state:
  stage: full-syscall
  owned_state:
  - init program binary (embedded in kernel image)
  resource_lifetime:
  - init binary is statically linked, loaded once at boot
preconditions:
- none
- syscall dispatch table populated
- user page table set up with trampoline and trapframe
postconditions:
- init process is running in U-mode
- program compiles and links
- user/user.ld exists and is valid GNU ld syntax
invariants:
- id: invariant-1
  text: init is the first user process (pid 1)
- id: invariant-2
  text: user programs run in U-mode with independent page tables
- id: generate_init_c-invariant-1
  text: init never exits (system panics if init exits)
