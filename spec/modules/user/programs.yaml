id: user/programs
module: user/programs
level: 3
purpose: User-space programs and their build infrastructure for the xv6 kernel. Generates
  init (pid 1), the shell (sh), core utilities (cat, echo, grep, kill, ln, ls, mkdir,
  rm, wc), and their linker script user/user.ld. User programs are compiled separately
  as freestanding binaries and linked into the kernel image.
owns:
- user/cat.c
- user/echo.c
- user/grep.c
- user/init.c
- user/kill.c
- user/ln.c
- user/ls.c
- user/mkdir.c
- user/rm.c
- user/sh.c
- user/user.ld
- user/wc.c
- user/zombie.c
- tests/generated/user/programs
