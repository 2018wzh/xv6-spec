id: kernel
module: kernel
level: 3
purpose: Aggregate namespace for all kernel-space xv6 modules. This parent ModuleSpec
  is referenced by late-stage architecture composition and expands stage-scoped to
  kernel/* descendants.
owns:
- kernel
- tests/generated/kernel
interface:
- kernel/*
properties:
- id: module-property-1
  text: aggregates only S-mode kernel modules
- id: module-property-2
  text: namespace remains stable for all kernel descendants through stage full-syscall
- id: module-property-3
  text: architecture slices may reference kernel as a stage-scoped aggregate
errors:
- none directly; child modules define concrete error semantics
state:
  stage: full-syscall
  owned_state:
  - none (aggregation namespace only)
  resource_lifetime:
  - namespace remains stable for all kernel descendants through stage full-syscall
preconditions: []
postconditions: []
invariants:
- id: invariant-1
  text: references to kernel expand only to active kernel/* modules at the selected
    stage
- id: invariant-2
  text: concrete runtime behavior is defined by descendant kernel/* modules
dependencies: []
rely: []
guarantee:
- 'exported: kernel/*'
algorithm_intent: Implement the full-syscall stage contract while preserving the declared
  xv6 module boundaries.
